server {
    listen 80;
    listen 443 ssl default_server;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Vite emits PDF.js as an ES module worker (*.mjs).
    # Nginx's default mime.types does not consistently map .mjs in all
    # release images. Browsers reject module workers served as octet-stream.
    # Keep CSP headers inherited from the server and never SPA-fallback this path.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass api:9000;
        fastcgi_read_timeout 30s;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass api:9000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}

# Dedicated hostname/TLS identity; the existing direct-IP HTTPS server above
# remains the default and retains its own independent IP certificate.
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/domain-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/domain-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_name mail.madenorth.dev;
