name: Cross Domain Email Client checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker-and-php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Email Worker tests
        run: npm test --prefix workers/email-archive
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: PHP syntax validation
        run: |
          set -e
          find backend/app backend/database/migrations backend/routes backend/bootstrap -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install backend MIME parser dependencies
        run: composer install --working-dir=backend --no-interaction --no-progress --prefer-dist --no-dev
      - name: MIME attachment decode and security smoke tests
        run: php backend/tests/attachment-smoke.php
      - name: Outbound email validation smoke tests
        run: php backend/tests/outbound-smoke.php
      - name: Approved brand mailbox inventory smoke tests
        run: php backend/tests/brand-mailboxes-smoke.php
      - name: ReceiptBoss Cloudflare deployment safety tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Laravel outgoing route registration
        run: |
          php backend/artisan route:list --path=api/drafts
          php backend/artisan route:list --path=api/outbound
          php backend/artisan route:list --path=api/messages/actions
      - name: Frontend navigation tests and production build
        run: |
          npm install --prefix frontend --no-audit --no-fund
          npm test --prefix frontend
          npm run build --prefix frontend
      - name: PDF.js worker MIME integration test in production Nginx
        run: |
          set -euo pipefail
          docker build -f docker/web/Dockerfile -t cdec-web-mime-test .
          mkdir -p "$RUNNER_TEMP/cdec-mime-cert"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=localhost" \
            -keyout "$RUNNER_TEMP/cdec-mime-cert/privkey.pem" \
            -out "$RUNNER_TEMP/cdec-mime-cert/fullchain.pem" >/dev/null 2>&1
          mkdir -p "$RUNNER_TEMP/cdec-mime-domain-cert"
          cp "$RUNNER_TEMP/cdec-mime-cert/fullchain.pem" "$RUNNER_TEMP/cdec-mime-domain-cert/fullchain.pem"
          cp "$RUNNER_TEMP/cdec-mime-cert/privkey.pem" "$RUNNER_TEMP/cdec-mime-domain-cert/privkey.pem"
          # The standalone static-asset test has no Laravel Compose service.
          # Supply only its hostname for nginx startup; no backend is needed.
          docker run -d --name cdec-pdf-mime-ci \
            --add-host api:127.0.0.1 \
            -p 127.0.0.1:18081:80 \
            -v "$RUNNER_TEMP/cdec-mime-cert:/etc/nginx/tls:ro" \
            -v "$RUNNER_TEMP/cdec-mime-domain-cert:/etc/nginx/domain-tls:ro" \
            cdec-web-mime-test
          trap 'docker logs cdec-pdf-mime-ci || true; docker rm -f cdec-pdf-mime-ci || true' EXIT
          docker exec cdec-pdf-mime-ci nginx -t
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null; then break; fi
            sleep 1
          done
          worker_path="$(docker exec cdec-pdf-mime-ci sh -c 'find /usr/share/nginx/html/assets -name "pdf.worker*.mjs" -print -quit')"
          test -n "$worker_path"
          asset_name="${worker_path##*/}"
          curl -fsSI "http://127.0.0.1:18081/assets/$asset_name" | tr -d '\r' | \
            grep -Eiq '^content-type: *(application|text)/javascript([;[:space:]]|$)'
      - name: Shell syntax validation
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Shared Caddy gateway and legacy TLS regression checks
        run: |
          set -euo pipefail
          bash -n scripts/verify-domain-https.sh
          bash -n scripts/verify-ip-https.sh
          bash -n scripts/renew-domain-https.sh
          bash -n scripts/renew-ip-https.sh
          grep -Fq 'Caddy gateway' scripts/verify-domain-https.sh
          grep -Fq 'https://$DOMAIN/api/status' scripts/verify-domain-https.sh
          grep -Fq '127.0.0.1:8080' scripts/verify-domain-https.sh
          ! grep -Fq 'verify-ip-https.sh' scripts/verify-domain-https.sh
          grep -Fq 'Direct-IP HTTPS renewal is retired' scripts/renew-ip-https.sh
          grep -Fq 'managed by the shared Caddy gateway' scripts/renew-domain-https.sh
